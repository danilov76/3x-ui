name: Infrastructure operation
run-name: Infrastructure operation
on:
  workflow_dispatch:
    inputs:
      target:
        description: GitHub Environment alias (use a neutral name, not an IP or domain)
        type: environment
        required: true
      operation:
        description: Operation
        type: choice
        options: [check, install, update, backup, restore]
        default: check
        required: true
      old_master_stopped:
        description: For restore only — old master is stopped and this target is clean
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: infrastructure-operations
  cancel-in-progress: false
jobs:
  operate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Ansible
        run: python3 -m pip install 'ansible-core==2.18.6'
      - name: Execute protected operation
        env:
          OPERATION: ${{ inputs.operation }}
          OLD_MASTER_STOPPED: ${{ inputs.old_master_stopped }}
          TARGET_CONFIG: ${{ secrets.TARGET_CONFIG }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          AGE_IDENTITY: ${{ secrets.AGE_IDENTITY }}
          ANSIBLE_HOST_KEY_CHECKING: 'True'
          ANSIBLE_DISPLAY_ARGS_TO_STDOUT: 'False'
        run: python3 infra/dispatch.py
